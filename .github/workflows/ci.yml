name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest
        
    - name: Run Python tests
      run: |
        pytest tests/
        
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: "20"
        
    - name: Install Node dependencies
      working-directory: ./wheeleye/frontend
      run: npm ci
      
    - name: Build Frontend
      working-directory: ./wheeleye/frontend
      run: npm run build

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Backend Image
      run: docker build -t wheeleye-backend:test -f Dockerfile.backend .
      
    - name: Build Frontend Image
      run: docker build -t wheeleye-frontend:test -f Dockerfile.frontend .
